<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101510" />
    <title>骰子投擲器</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel" aria-labelledby="app-title">
        <header>
          <p class="eyebrow">TABLETOP DICE</p>
          <h1 id="app-title">骰子投擲器</h1>
        </header>

        <details id="dice-config" class="dice-config" open>
          <summary>骰子配置</summary>
          <div id="dice-groups" class="dice-groups" aria-label="骰組"></div>
          <button id="add-group" class="text-button" type="button">＋ 加一組骰子</button>
        </details>
        <p id="validation" class="validation" role="alert"></p>
        <button id="roll-button" class="roll-button" type="button" disabled>載入 3D 骰子…</button>
      </section>

      <section class="table-panel" aria-label="骰子投擲區">
        <div id="dice-box" aria-hidden="true"></div>
        <div id="empty-state" class="empty-state">
          <span class="d20-mark">20</span>
          <p>準備好後，按下「開始投擲」</p>
        </div>
        <section id="results" class="results" aria-live="polite">
          <p id="total" class="final-total"></p>
          <details id="calculation" class="calculation">
            <summary>查看計算過程</summary>
            <ol id="result-groups"></ol>
            <p id="calculation-total" class="calculation-total"></p>
          </details>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
